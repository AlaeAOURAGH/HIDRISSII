backend:
  name: github
  repo: AlaeAOURAGH/HIDRISSII
  branch: main
  base_url: https://www.hidrissi.com
  auth_endpoint: api/auth
  auth_scope: public_repo
media_folder: uploads
public_folder: /uploads
locale: fr
app_title: HIDRISSI · Ma boutique
site_url: https://www.hidrissi.com
display_url: https://www.hidrissi.com
logo:
  src: /assets/icon-512.png
  show_in_header: true
collections:
  - name: produits
    label: Mes produits
    label_singular: Produit
    description: 'Cliquez sur un produit pour changer son prix, ses photos ou son stock. Pour ajouter un modèle, cliquez sur Nouveau produit. Enregistrez pour mettre à jour le site.'
    icon: electric_scooter
    file: data/catalogue.json
    identifier_field: name
    create: true
    delete: true
    duplicate: true
    editor:
      preview: false
    summary: "{{name}} — {{price}} dh · {{in_stock | ternary('En stock', 'Rupture de stock')}}"
    thumbnail: images.*
    sortable_fields: [name, price, brand, in_stock]
    table_columns:
      - {field: name, label: Produit}
      - {field: price, label: Prix (dh)}
      - {field: in_stock, label: En stock}
      - {field: brand, label: Marque}
    view_filters:
      - {label: Disponibles à la vente, field: in_stock, pattern: true}
      - {label: En rupture de stock, field: in_stock, pattern: false}
    fields:
      - {name: name, label: Nom du produit, widget: string, hint: 'Exemple : WATHIUM RS-2. Ce nom est visible par les clients.'}
      - {name: price, label: Prix de vente (dh), widget: number, value_type: float, min: 0, hint: 'Écrivez uniquement le montant. Exemple : 6300. Ne saisissez pas « dh ».'}
      - {name: in_stock, label: Disponible à la vente, widget: boolean, default: true, hint: 'Activé : les clients peuvent commander. Désactivé : le produit reste visible avec la mention Rupture de stock.'}
      - name: images
        label: Photos du produit
        widget: list
        min: 1
        hint: 'Ajoutez vos photos ici. La première est la photo principale. Glissez-les pour changer leur ordre. JPEG, PNG ou WebP ; maximum conseillé : 500 Ko par photo.'
        field: {name: image, label: Photo, widget: image, choose_url: false}
      - {name: brand, label: Marque, widget: string, hint: 'Exemple : WATHIUM, KEPOW ou SEGWAY.'}
      - name: category
        label: Type de trottinette
        widget: select
        default: city
        options:
          - {label: Performance — puissante et sportive, value: perf}
          - {label: Urbaine — trajets quotidiens, value: city}
          - {label: Compacte — facile à transporter, value: compact}
      - {name: power, label: Puissance du moteur, widget: string, required: false, hint: 'Exemple : 1000W ou 2×2000W.'}
      - {name: speed, label: Vitesse maximale, widget: string, required: false, hint: 'Exemple : 45 km/h.'}
      - {name: range, label: Autonomie, widget: string, required: false, hint: 'Exemple : 40–50 km.'}
      - name: short_desc
        label: Petit texte sous la photo
        widget: object
        hint: 'Une ou deux phrases pour présenter le modèle.'
        fields:
          - {name: fr, label: Texte en français, widget: text}
          - {name: ar, label: Texte en arabe (facultatif), widget: text, required: false, hint: 'Si vous laissez ce champ vide, le texte français sera affiché.'}
      - name: desc
        label: Description détaillée
        widget: object
        collapsed: true
        fields:
          - {name: fr, label: Description en français, widget: text, required: false}
          - {name: ar, label: Description en arabe (facultatif), widget: text, required: false}
      - name: features
        label: Points forts (facultatif)
        widget: object
        collapsed: true
        required: false
        fields:
          - {name: fr, label: Points forts en français, widget: list, required: false}
          - {name: ar, label: Points forts en arabe, widget: list, required: false}
      - name: badge
        label: Étiquette promotionnelle (facultatif)
        widget: object
        collapsed: true
        required: false
        hint: 'Exemple : Nouveau, Promotion ou Meilleure vente. Laissez vide si inutile.'
        fields:
          - {name: fr, label: Étiquette en français, widget: string, required: false}
          - {name: ar, label: Étiquette en arabe, widget: string, required: false}
      - {name: id, label: Référence automatique, widget: uuid, readonly: true, hint: 'Créée automatiquement. Vous n’avez rien à saisir.'}
      - {name: category_label, widget: hidden}
      - {name: speed_i18n, widget: hidden}
      - {name: range_i18n, widget: hidden}
      - {name: specs, widget: hidden}
      - {name: image_meta, widget: hidden}
