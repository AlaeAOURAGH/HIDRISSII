backend:
  name: github
  repo: AlaeAOURAGH/HIDRISSII
  branch: main
  base_url: https://www.hidrissi.com
  auth_endpoint: api/auth
  auth_scope: public_repo
media_folder: uploads
public_folder: /uploads
locale: fr
collections:
  - name: catalogue
    label: Catalogue
    files:
      - name: produits
        label: Produits
        file: data/products.json
        fields:
          - {name: cats, widget: hidden, required: false}
          - {name: brands, widget: hidden, required: false}
          - {name: waNumberDefault, widget: hidden, required: false}
          - name: products
            label: Produits
            widget: list
            summary: '{{fields.name}} — {{fields.price}} dh'
            fields:
              - {name: category_label, widget: hidden, required: false}
              - {name: speed_i18n, widget: hidden, required: false}
              - {name: range_i18n, widget: hidden, required: false}
              - {name: specs, widget: hidden, required: false}
              - {name: image_meta, widget: hidden, required: false}
              - {name: id, label: Identifiant unique (minuscules et tirets), widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Minuscules, chiffres et tirets uniquement']}
              - {name: name, label: Nom, widget: string}
              - {name: category, label: Catégorie, widget: select, options: [{label: Performance, value: perf}, {label: Urbain, value: city}, {label: Compacte, value: compact}]}
              - {name: brand, label: Marque, widget: string}
              - {name: price, label: Prix (dh), widget: number, value_type: float, min: 0}
              - {name: in_stock, label: En stock, widget: boolean, default: true}
              - {name: power, label: Puissance, widget: string, required: false}
              - {name: speed, label: Vitesse, widget: string, required: false}
              - {name: range, label: Autonomie, widget: string, required: false}
              - name: badge
                label: Badge
                widget: object
                fields:
                  - {name: fr, label: Français, widget: string, required: false}
                  - {name: ar, label: Arabe, widget: string, required: false}
              - name: short_desc
                label: Description courte
                widget: object
                fields:
                  - {name: fr, label: Français, widget: text}
                  - {name: ar, label: Arabe, widget: text, required: false}
              - name: desc
                label: Description complète
                widget: object
                fields:
                  - {name: fr, label: Français, widget: text}
                  - {name: ar, label: Arabe, widget: text, required: false}
              - name: features
                label: Caractéristiques
                widget: object
                fields:
                  - {name: fr, label: Français, widget: list, required: false}
                  - {name: ar, label: Arabe, widget: list, required: false}
              - name: images
                label: Photos (première = principale)
                widget: list
                field: {name: image, label: Photo, widget: image, choose_url: false}
